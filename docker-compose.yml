services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env
    depends_on:
      - db
    working_dir: /workspace/backend

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - /workspace/frontend/node_modules
    working_dir: /workspace/frontend

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rewind
      POSTGRES_PASSWORD: rewind
      POSTGRES_DB: rewind
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: